name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pip install Pillow
      - name: Build in camp's settings, so the download needs no config file
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SKILLS_SHEET: ${{ secrets.SKILLS_SHEET }}
        run: python tools/build_settings.py
      - name: Build platform icon
        run: python tools/build_icon.py
      - run: pyinstaller brainwaves.spec
      - name: Package Linux release
        if: matrix.os == 'ubuntu-latest'
        run: python tools/build_linux_release.py
      - name: Upload Linux release
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: brainwaves-${{ matrix.os }}
          path: dist/brainwaves-linux.tar.gz
      - name: Upload Windows/macOS release
        if: matrix.os != 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: brainwaves-${{ matrix.os }}
          path: dist/brainwaves-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - uses: softprops/action-gh-release@v2
        with:
          files: downloaded/*/brainwaves-*
          generate_release_notes: true
