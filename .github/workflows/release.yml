name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pyinstaller brainwaves.spec
      - uses: actions/upload-artifact@v4
        with:
          name: brainwaves-${{ matrix.os }}
          path: dist/brainwaves-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - uses: softprops/action-gh-release@v2
        with:
          files: downloaded/*/brainwaves-*
          generate_release_notes: true
