site_name: Brain Waves
site_description: Cabin activity scheduling for Camp Augusta
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Install and set up: install.md
  - Using the board: board.md
  - Comments: comments.md
  - The sheets: sheets.md
  - Design: technical-outline.md
  - Development: development.md
